server:
  port: 8084
spring:
  application:
    name: notification-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_SENDER_MAIL}
    password: ${EMAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  main:
    allow-bean-definition-overriding: true
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest